name: "Setup vivacity"
description: "Install vivacity (a drop-in `composer install` in Rust) on the runner and add it to PATH."
author: "Adel Kaleche"

branding:
  icon: "zap"
  color: "purple"

inputs:
  version:
    description: >
      Release tag to install (e.g. v0.25.0). Defaults to the ref this action
      was used with (`uses: Adelagric/vivacity@v0.25.0` installs v0.25.0), so the
      action and the binary always match.
    required: false
    default: ${{ github.action_ref }}
  binary:
    description: >
      Path to an already-built vivacity binary to install instead of a release
      download (used by vivacity's own CI to test the action against the
      current commit).
    required: false
    default: ""
  cache:
    description: >
      Restore and save Composer's cache directory (dist zips, VCS mirrors,
      repository metadata) between runs: the directory `vivacity config
      --global cache-dir` prints, which vivacity reads and feeds and rebuilds
      its own store from. Set COMPOSER_CACHE_DIR / COMPOSER_HOME /
      XDG_CACHE_HOME at job level, before this action, if you set them.
    required: false
    default: "true"

outputs:
  version:
    description: "The version string reported by `vivacity --version`."
    value: ${{ steps.install.outputs.version }}
  composer-cache-dir:
    description: >
      Composer's cache directory as vivacity resolves it (`vivacity config
      --global cache-dir`, the same value as `composer config --global
      cache-dir`), resolved even with `cache: 'false'`; empty when it could not
      be resolved.
    value: ${{ steps.cache-dir.outputs.composer-cache-dir }}

runs:
  using: "composite"
  steps:
    - name: Install vivacity
      id: install
      shell: bash
      env:
        VIVACITY_VERSION: ${{ inputs.version }}
        VIVACITY_BINARY: ${{ inputs.binary }}
        VIVACITY_INSTALL_DIR: ${{ runner.temp }}/vivacity-bin
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -eu
        exe=""; [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
        mkdir -p "$VIVACITY_INSTALL_DIR"
        if [ -n "$VIVACITY_BINARY" ]; then
          install -m 0755 "$VIVACITY_BINARY" "$VIVACITY_INSTALL_DIR/vivacity$exe"
        else
          case "$VIVACITY_VERSION" in
            v[0-9]*) ;;
            *) echo "::error::inputs.version must be a release tag like v0.25.0 (got '$VIVACITY_VERSION'); pin the action to a release tag"; exit 1 ;;
          esac
          sh "$GITHUB_ACTION_PATH/install.sh"
        fi
        echo "$VIVACITY_INSTALL_DIR" >> "$GITHUB_PATH"
        echo "version=$("$VIVACITY_INSTALL_DIR/vivacity$exe" --version)" >> "$GITHUB_OUTPUT"

    # Asked of the binary rather than recomputed here: the directory saved is
    # the one vivacity writes to, Config::get('cache-dir') included (`~`,
    # `$VAR`, trailing slashes, /etc/xdg). Resolved once, from the
    # environment this action is called with.
    - name: Resolve Composer's cache directory
      id: cache-dir
      shell: bash
      env:
        VIVACITY_INSTALL_DIR: ${{ runner.temp }}/vivacity-bin
        VIVACITY_CACHE_INPUT: ${{ inputs.cache }}
      run: |
        set -u
        exe=""; [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
        dir=""; why=""
        if ! dir="$("$VIVACITY_INSTALL_DIR/vivacity$exe" config --global cache-dir)"; then
          dir=""; why="vivacity config --global cache-dir failed"
        fi
        # A Git Bash path (/c/...) is not one actions/cache or PHP reads.
        if [ "$RUNNER_OS" = "Windows" ] && [ "${dir#/}" != "$dir" ]; then
          dir="$(cygpath -m "$dir")"
        fi
        echo "Composer cache directory: ${dir:-<none>}"
        if [ -z "$why" ]; then
          case "$dir" in
            "") why="the cache directory is empty" ;;
            /*|[A-Za-z]:*|\\\\*) ;;
            *) why="the cache directory $dir is relative (Composer resolves it from the project directory)" ;;
          esac
        fi
        # Cache::isUsable: a cache Composer itself disables.
        # shellcheck disable=SC2016 # a literal `$null`
        if [ -z "$why" ] && printf '%s' "$dir" | grep -Eq '(^|[\\/])(\$null|nul|NUL|/dev/null)([\\/]|$)'; then
          why="the cache directory $dir disables Composer's cache"
        fi
        if [ "$VIVACITY_CACHE_INPUT" != "true" ]; then
          # Asked for: said in the log, not as an annotation on every run.
          echo "Not cached: cache is '$VIVACITY_CACHE_INPUT'"
          echo "cacheable=false" >> "$GITHUB_OUTPUT"
        elif [ -n "$why" ]; then
          echo "::notice title=vivacity::Composer's cache directory is not cached: $why"
          echo "cacheable=false" >> "$GITHUB_OUTPUT"
        else
          echo "cacheable=true" >> "$GITHUB_OUTPUT"
        fi
        {
          echo "composer-cache-dir<<VIVACITY_EOF"
          echo "$dir"
          echo "VIVACITY_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Cache Composer's cache directory
      if: steps.cache-dir.outputs.cacheable == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache-dir.outputs.composer-cache-dir }}
        key: vivacity-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          vivacity-${{ runner.os }}-${{ runner.arch }}-
