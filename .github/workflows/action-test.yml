name: action

# The composite action at the repository root, exercised against the binary
# built from this very commit (`binary:` input), then a real install of the
# frozen Laravel skeleton over the network — the end-to-end path a user's CI
# takes with `uses: Adelagric/vivacity@vX.Y.Z`. A second job packages that
# same binary like release.yml does and runs install.sh (and install.ps1 on
# Windows) against it, so the installers are proven before any release.

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the jobs install and run third-party PHP packages.
permissions:
  contents: read

jobs:
  action:
    name: action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p vivacity

      - name: Setup vivacity from the local action
        id: setup
        uses: ./
        with:
          binary: target/release/vivacity${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: vivacity is on PATH and reports its version
        run: |
          which vivacity
          vivacity --version
          test "${{ steps.setup.outputs.version }}" = "$(vivacity --version)"

      - name: vivacity is visible to the native shell too
        if: runner.os == 'Windows'
        shell: pwsh
        run: vivacity --version

      # The cache directory is resolved even with caching off, from the
      # environment the action is called with.
      - name: Setup vivacity again, cache off, COMPOSER_CACHE_DIR set
        id: setup-cc
        uses: ./
        env:
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/cc
        with:
          binary: target/release/vivacity${{ runner.os == 'Windows' && '.exe' || '' }}
          cache: "false"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:2.10.3
          # Compiled in on Linux/macOS, separate DLLs on Windows (Laravel's
          # lock requires ext-fileinfo).
          extensions: mbstring, intl, fileinfo, zip, curl

      # What the cache restored proves nothing about where vivacity writes:
      # its files/ goes, so that the install below must fill it again.
      - name: Empty the restored files/ of the resolved cache directory
        env:
          CACHE_DIR: ${{ steps.setup.outputs.composer-cache-dir }}
        run: |
          : "${CACHE_DIR:?the action resolved no cache directory}"
          rm -rf "$CACHE_DIR/files"

      - name: Install the Laravel skeleton with vivacity (network)
        working-directory: fixtures/projects/laravel
        run: |
          vivacity install
          php artisan --version
          test -f vendor/composer/installed.php

      - name: Second install is a no-op
        working-directory: fixtures/projects/laravel
        run: |
          vivacity install 2> install.log
          cat install.log
          grep -q ' 0 installed, ' install.log

      - name: The install fed the cache directory the action resolved
        env:
          CACHE_DIR: ${{ steps.setup.outputs.composer-cache-dir }}
        run: |
          echo "composer-cache-dir: [$CACHE_DIR]"
          test -n "$CACHE_DIR"
          test -n "$(ls -A "$CACHE_DIR/files")"

      # Last: `composer config` creates the directories it prints (Factory's
      # .htaccess protection), which must not help the checks above.
      - name: The resolved directory is Composer's (runner environment, then COMPOSER_CACHE_DIR)
        env:
          CACHE_DIR: ${{ steps.setup.outputs.composer-cache-dir }}
          CACHE_DIR_CC: ${{ steps.setup-cc.outputs.composer-cache-dir }}
          CC: ${{ runner.temp }}/cc
        run: |
          # Composer ends its line with PHP_EOL (\r\n on Windows).
          expected="$(composer config --global cache-dir | tr -d '\r')"
          echo "action:   [$CACHE_DIR]"
          echo "composer: [$expected]"
          test "$CACHE_DIR" = "$expected"
          expected_cc="$(COMPOSER_CACHE_DIR="$CC" composer config --global cache-dir | tr -d '\r')"
          echo "action:   [$CACHE_DIR_CC]"
          echo "composer: [$expected_cc]"
          test -n "$CACHE_DIR_CC"
          test "$CACHE_DIR_CC" = "$expected_cc"

  installers:
    name: installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p vivacity

      - name: Package like release.yml
        run: tools/package-release.sh v0.0.0-ci ${{ matrix.target }} "" "$RUNNER_TEMP/assets"

      - name: install.sh against the local assets
        run: |
          rm -rf "$RUNNER_TEMP/bin-sh"
          VIVACITY_VERSION=v0.0.0-ci VIVACITY_DOWNLOAD_BASE="$RUNNER_TEMP/assets" VIVACITY_INSTALL_DIR="$RUNNER_TEMP/bin-sh" sh install.sh
          exe=""; [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          "$RUNNER_TEMP/bin-sh/vivacity$exe" --version

      - name: install.ps1 against the local assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VIVACITY_VERSION = 'v0.0.0-ci'
          $env:VIVACITY_DOWNLOAD_BASE = Join-Path $env:RUNNER_TEMP 'assets'
          $env:VIVACITY_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin-ps'
          ./install.ps1
          & (Join-Path $env:VIVACITY_INSTALL_DIR 'vivacity.exe') --version

      - name: install.sh resolves the latest real release
        run: |
          rm -rf "$RUNNER_TEMP/bin-latest"
          VIVACITY_INSTALL_DIR="$RUNNER_TEMP/bin-latest" sh install.sh
          exe=""; [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          "$RUNNER_TEMP/bin-latest/vivacity$exe" --version
        # No Windows asset exists before the first 0.7 release: that step
        # would fail there until then.
        if: runner.os != 'Windows'
