name: drift

# vivacity promises byte-identical output against Composer 2.10.3 (the vendored
# reference). This job asks the question "is that still true against the
# Composer people actually install?" — latest stable and the snapshot —
# without touching ci.yml, which stays pinned and deterministic.
#
# Stage 1 diffs the reference twins (docs/reference/*.php) against the same
# files inside the newer phar: it names the exact port that moved, in seconds.
# A drift that has been read and settled is acknowledged in
# docs/reference/DRIFT-ACK, keyed by the fingerprint of the diff itself, so it
# stops alerting until upstream moves again.
# Stage 2 runs the tests and the whole harness against that Composer.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

# The drift job runs third-party Composer plugins with the token within
# reach (setup-php writes it into auth.json): it gets read access only. The
# issue is opened by the report job, which checks nothing out and runs no
# plugin.
permissions:
  contents: read

jobs:
  drift:
    name: drift (composer ${{ matrix.composer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        composer: [v2, snapshot]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:${{ matrix.composer }}
          extensions: mbstring, intl, gd, exif, bcmath, sodium, xml, curl, zip, fileinfo
          ini-values: memory_limit=1G

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Composer version under test
        id: composer
        run: |
          composer --version
          echo "version=$(composer --version --no-ansi 2>/dev/null | sed -n 's/^Composer version \([^ ]*\).*/\1/p')" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads and fixtures
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/composer
            fixtures/work
          key: fixtures-drift-${{ runner.os }}-${{ steps.composer.outputs.version }}-${{ hashFiles('fixtures/make.sh') }}

      - name: Stage 1 — reference twins
        id: twins
        continue-on-error: true
        run: harness/drift-reference.sh

      - name: Build
        run: cargo build --release

      - name: Fixtures
        run: fixtures/make.sh

      # Every command runs whatever the previous one said: under `bash -e` the
      # first failing test ended the step, and for weeks the snapshot channel
      # reported one expected difference (`plugin-api-version` 2.9.0 → 2.11.0)
      # while no harness ran behind it. A drift report is only useful complete.
      - name: Stage 2 — tests and harness
        id: harness
        continue-on-error: true
        run: |
          status=0
          cargo test --no-fail-fast || status=1
          for h in "harness/diff-vendor.sh" "harness/diff-vendor.sh --with-autoloader" \
                   harness/removal.sh harness/transitions.sh harness/path-repos.sh harness/boot.sh; do
            echo "::group::$h"
            $h || status=1
            echo "::endgroup::"
          done
          exit $status

      # Handed to the report job as an artifact: one file per channel,
      # four lines (channel, version, twins, harness), re-validated there
      # since this job ran third-party code.
      - name: Record the drift
        id: record
        if: steps.twins.outcome == 'failure' || steps.harness.outcome == 'failure'
        env:
          COMPOSER_VERSION: ${{ steps.composer.outputs.version }}
          CHANNEL: ${{ matrix.composer }}
          TWINS: ${{ steps.twins.outcome }}
          HARNESS: ${{ steps.harness.outcome }}
        run: |
          rm -rf "$RUNNER_TEMP/drift-report"; mkdir -p "$RUNNER_TEMP/drift-report"
          printf '%s\n' "$CHANNEL" "$COMPOSER_VERSION" "$TWINS" "$HARNESS" > "$RUNNER_TEMP/drift-report/$CHANNEL.txt"

      - uses: actions/upload-artifact@v4
        if: steps.record.outcome == 'success'
        with:
          name: drift-${{ matrix.composer }}
          path: ${{ runner.temp }}/drift-report/${{ matrix.composer }}.txt

      - name: Drift found
        if: steps.twins.outcome == 'failure' || steps.harness.outcome == 'failure'
        run: exit 1

  report:
    name: report
    needs: drift
    # `needs` alone would skip this job exactly when it is wanted.
    if: ${{ !cancelled() && needs.drift.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        # A drift job that failed before recording (a build error) leaves
        # nothing to download, and nothing to report.
        continue-on-error: true
        with:
          pattern: drift-*
          path: drift-report
          merge-multiple: true

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          labelled=0
          for f in drift-report/v2.txt drift-report/snapshot.txt; do
            [ -f "$f" ] || continue
            { read -r CHANNEL; read -r COMPOSER_VERSION; read -r TWINS; read -r HARNESS; } < "$f" || true
            # Written by a job that ran third-party code: only the values
            # that job can legitimately produce go any further.
            case "$CHANNEL" in v2|snapshot) ;; *) echo "::warning::$f: unexpected channel, ignored"; continue ;; esac
            [ "$f" = "drift-report/$CHANNEL.txt" ] || { echo "::warning::$f: channel mismatch, ignored"; continue; }
            case "$TWINS" in success|failure|skipped|cancelled) ;; *) echo "::warning::$f: bad twins outcome, ignored"; continue ;; esac
            case "$HARNESS" in success|failure|skipped|cancelled) ;; *) echo "::warning::$f: bad harness outcome, ignored"; continue ;; esac
            if ! [[ "$COMPOSER_VERSION" =~ ^[0-9A-Za-z.+@-]{1,64}$ ]]; then COMPOSER_VERSION="(unreadable)"; fi
            if [ "$labelled" = 0 ]; then
              gh label create drift --color B60205 --description "Output drifted from a newer Composer" --force
              labelled=1
            fi
            # One open issue per channel, the version in the body: the snapshot
            # channel's version string carries a build ref and changes every
            # week, so putting it in the title opened a new issue each run.
            # A drift that comes back after being fixed does open a fresh issue,
            # since only OPEN ones are looked up.
            title="Drift against Composer ($CHANNEL)"
            body="Composer **$COMPOSER_VERSION** · reference twins: **$TWINS** · tests + harness: **$HARNESS** · run: $RUN_URL

          The vendored reference is Composer 2.10.3. A failing stage 1 names the file whose port must be re-read; a failing stage 2 with a passing stage 1 means behaviour changed outside the vendored files."
            # Matched exactly rather than through the search index: the title
            # holds parentheses, and `in:title` is a substring match. The second
            # branch catches an issue opened under the old title, which carried
            # the version — so this change migrates itself instead of opening a
            # duplicate beside it.
            existing=$(gh issue list --label drift --state open --limit 50 --json number,title \
              | jq -r --arg t "$title" --arg c "($CHANNEL)" '
                  (map(select(.title == $t)) | .[0].number)
                  // (map(select(.title | startswith("Drift against Composer") and endswith($c))) | .[0].number)
                  // empty')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "$body"
            else
              gh issue create --title "$title" --label drift --body "$body"
            fi
          done
