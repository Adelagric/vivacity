name: ci

on:
  push:
    branches: [main]
  pull_request:

# The harnesses run third-party Composer plugins (PHP) with the job's token
# within reach (COMPOSER_AUTH below, setup-php's auth.json, checkout's git
# config): it may read the repository and nothing else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  parity:
    name: parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The job's token for GitHub's dists (api.github.com), on both sides of
    # every harness — Composer and vivacity read COMPOSER_AUTH alike — so that
    # no harness downloads anonymously from a runner IP shared with others
    # (macOS, 2026-10-29). Issued for every run, read-only on a fork's PR.
    env:
      COMPOSER_AUTH: ${{ format('{{"github-oauth":{{"github.com":"{0}"}}}}', github.token) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # /rate_limit costs nothing. Read at both ends of the job, anonymous
      # and with the token: what the harnesses spent of each budget.
      - name: GitHub API budget (start)
        run: |
          for who in anonymous token; do
            if [ "$who" = token ]; then h=(-H "Authorization: token $GH_TOKEN"); else h=(); fi
            printf '%s ' "$who"; curl -fsS "${h[@]}" https://api.github.com/rate_limit | jq -c '.resources.core' || echo unavailable
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          # Pinned to the vendored reference: ci.yml must be deterministic.
          # drift.yml is the job that asks about newer Composer versions.
          tools: composer:2.10.3
          extensions: mbstring, intl, gd, exif, bcmath, sodium, xml, curl, zip, fileinfo
          ini-values: memory_limit=1G

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cache Composer downloads and fixtures
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/composer
            ~/Library/Caches/composer
            fixtures/work
          key: fixtures-${{ runner.os }}-${{ hashFiles('fixtures/make.sh') }}

      - name: Gates
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo build --release

      - name: Fixtures (create-project sans scripts, qualification à l'oracle)
        run: fixtures/make.sh

      - name: Tests (unitaires + oracles PHP)
        run: cargo test

      - name: PCRE2 symbols all prefixed (embeddable next to libphp.a)
        run: tools/check-pcre2-symbols.sh

      - name: No C decompressor in the graph (embeddable next to libphp.a)
        run: tools/check-clib-deps.sh

      - name: Parity without autoloader
        run: harness/net-retry.sh harness/diff-vendor.sh

      - name: Parity with autoloader, cold then warm classmap cache
        run: |
          harness/net-retry.sh harness/diff-vendor.sh --with-autoloader
          harness/net-retry.sh harness/diff-vendor.sh --with-autoloader

      - name: Resolver parity (composer.lock written by `update --no-install`)
        run: harness/net-retry.sh harness/update.sh

      - name: Manifest edits by `remove` (composer.json and composer.lock)
        run: harness/net-retry.sh harness/steps.sh

      - name: Removals (inside and outside vendor/)
        run: harness/net-retry.sh harness/removal.sh
      - name: Transitions left to Composer (plugin upgrade)
        run: harness/net-retry.sh harness/transitions.sh
      - name: Path repositories (symlink and mirror strategies, modes and links)
        run: harness/net-retry.sh harness/path-repos.sh
      - name: Git-only packages (clone and .git like GitDownloader, VCS cache, named fallbacks)
        run: harness/net-retry.sh harness/git-sources.sh
      - name: config.vendor-dir / bin-dir (install, dump -o, no-op on moved directories)
        run: harness/net-retry.sh harness/vendor-dir.sh
      - name: wikimedia/composer-merge-plugin (merged root, no implicit update)
        run: harness/net-retry.sh harness/merge-plugin.sh
      - name: --run-scripts (the scripts, by Composer, in Composer's order)
        run: harness/net-retry.sh harness/scripts.sh
      - name: tar dists (asset-packagist tarballs, modes from the header, cache shared)
        run: harness/net-retry.sh harness/tar-dist.sh
      - name: yiisoft/yii2-composer (extensions.php from the yii2-extension packages)
        run: harness/net-retry.sh harness/yii2-composer.sh
      - name: bamarni/composer-bin-plugin (deprecation lines, forward-command refused)
        run: harness/net-retry.sh harness/bin-plugin.sh
      - name: roots/wordpress-core-installer (wordpress-core placed at wordpress-install-dir)
        run: harness/net-retry.sh harness/wp-core.sh
      - name: mnsami/composer-custom-directory-installer (libraries at extra.installer-paths)
        run: harness/net-retry.sh harness/custom-dirs.sh
      - name: Custom installers (kirby, neos, davidbarratt, johnpbloch + installers 1.12, thelia, contao-components, oomphinc, craftcms)
        run: harness/net-retry.sh harness/custom-installers.sh
      - name: Plugins with effects at script events (spiral, sculpin, laminas component and skeleton installers, dg and liborm85 cleaners, cakephp)
        run: harness/net-retry.sh harness/plugins-round2.sh
      - name: drupol/composer-packages (five classes generated from the lock)
        run: harness/net-retry.sh harness/composer-packages.sh
      - name: infection/extension-installer, typo3/class-alias-loader and cms-composer-installers (inert under typo3/cms)
        run: harness/net-retry.sh harness/plugins-round3.sh
      - name: mlocati/composer-patcher (patches applied by patch, patches_applied in installed.json)
        run: harness/net-retry.sh harness/composer-patcher.sh
      - name: composer/package-versions-deprecated (Versions.php generated from the lock)
        run: harness/net-retry.sh harness/package-versions.sh
      - name: Plugin installers' lines and their order (phpstan, rector, dealerdirect, c3, package-versions)
        run: harness/net-retry.sh harness/plugin-lines.sh
      - name: dealerdirect v0.7.2 (rulesets searched in the whole project, Finder rules)
        run: harness/net-retry.sh harness/dealerdirect-07.sh
      - name: allow-plugins at plugin load (refusals, warnings) and php-http/discovery after an update
        run: harness/net-retry.sh harness/allow-plugins.sh
      - name: symfony/flex at install (.env from .env.dist, its lines, symfony-pack)
        run: harness/net-retry.sh harness/flex-install.sh
      - name: symfony/flex on update with install (recipes decided before writing)
        run: harness/net-retry.sh harness/flex-update.sh
      - name: symfony/flex recipes applied on update (real recipes served offline)
        run: harness/net-retry.sh harness/flex-recipes.sh
      - name: FileDownloader's Downloading lines (cold files cache on both sides)
        run: harness/net-retry.sh harness/download-lines.sh
      - name: Artifact repositories (local dists read off the disk, modes kept)
        run: harness/net-retry.sh harness/artifact-repo.sh
      - name: The comparator's own tolerances (anchored, not substrings)
        run: harness/net-retry.sh harness/compare-selftest.sh
      - name: net-retry.sh on scripted failures and the captured GitHub refusal (no retry, cause named)
        run: harness/net-retry-selftest.sh
      - name: Where a github-oauth token goes (api.github.com only, redirects, GHE, COMPOSER_AUTH last) and that it changes no output
        run: harness/net-retry.sh harness/auth-hosts.sh
      - name: unzip fails then ZipArchive resumes (duplicates, file/dir collisions)
        run: harness/net-retry.sh harness/two-stage.sh
      - name: Transport failures exit 100 (404 dist, dead repository, missing local dist)
        run: harness/net-retry.sh harness/transport-exit.sh
      - name: -q and -v print what Composer prints (stdout and stderr whole)
        run: harness/net-retry.sh harness/verbosity.sh
      - name: The fallback hands Composer the command line (argv, cwd, env, exit code)
        run: harness/net-retry.sh harness/fallback-args.sh
      - name: Composer's cache directory (config --global cache-dir and where zips land, env matrix, offline)
        run: harness/composer-cache-dir.sh
      - name: update/require/remove with no PHP under --ignore-platform-reqs (Composer with its PHP as the reference)
        run: harness/net-retry.sh harness/no-php.sh

      - name: Per-file scan cache (root sources edited between installs)
        run: harness/net-retry.sh harness/root-scan.sh

      - name: Boot on vivacity vendor
        run: harness/net-retry.sh harness/boot.sh

      - name: Reference twins still match the pinned Composer
        run: harness/net-retry.sh harness/drift-reference.sh

      - name: GitHub API budget (end)
        if: always()
        run: |
          for who in anonymous token; do
            if [ "$who" = token ]; then h=(-H "Authorization: token $GH_TOKEN"); else h=(); fi
            printf '%s ' "$who"; curl -fsS "${h[@]}" https://api.github.com/rate_limit | jq -c '.resources.core' || echo unavailable
          done
        env:
          GH_TOKEN: ${{ github.token }}
