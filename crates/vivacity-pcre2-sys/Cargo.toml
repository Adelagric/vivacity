[package]
name = "vivacity-pcre2-sys"
version.workspace = true
edition = "2024"
authors = ["Andrew Gallant <jamslam@gmail.com>", "Adel Kaleche <kaleche@gmail.com>"]
build = "build.rs"
description = "pcre2-sys 0.2.10 (PCRE2 10.46) built statically with every symbol prefixed `vivacity_`, so that a program embedding vivacity can also link a PCRE2 of its own (PHP's libphp.a bundles one)."
homepage = "https://github.com/Adelagric/vivacity"
documentation = "https://docs.rs/pcre2-sys"
readme = "README.md"
keywords = ["pcre2", "regex", "composer"]
categories = ["external-ffi-bindings"]
license = "Unlicense OR MIT"
repository.workspace = true
include = ["build.rs", "src/**", "upstream/**", "README.md", "COPYING", "LICENSE-MIT", "UNLICENSE", "LICENCE-pcre2", "rustfmt.toml"]

[lib]
name = "pcre2_sys"
path = "src/lib.rs"

[lints.clippy]
all = "allow"

[dependencies]
libc = "=0.2.189"

[build-dependencies]
cc = { version = "=1.4.5", features = ["parallel"] }
