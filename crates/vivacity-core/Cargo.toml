[package]
name = "vivacity-core"
description = "Manifests, content hash, platform checks, dist fetching, content-addressed store and installation for vivacity"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["composer", "php", "installer"]
categories = ["development-tools", "command-line-utilities"]

[features]
# The default keeps the standalone tool self-contained: reqwest's rustls-tls
# bundles the ring crypto provider. Embedders that link another rustls
# provider (for example aws-lc-rs) must build with
# `default-features = false, features = ["rustls-tls-no-provider"]` and
# install a process-wide default provider themselves, because Cargo features
# are additive and two compiled-in providers make
# `rustls::CryptoProvider::from_crate_features()` return None.
default = ["rustls-tls-ring"]
rustls-tls-ring = ["reqwest/rustls-tls"]
rustls-tls-no-provider = ["reqwest/rustls-tls-webpki-roots-no-provider"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
zip.workspace = true
tar.workspace = true
flate2.workspace = true
# Feature-only dependency (no code uses it): selects the pure-Rust
# libbz2-rs-sys backend for the bzip2 crate that zip pulls in, so no
# unprefixed BZ2_* symbols end up in an embedding host's link.
bzip2.workspace = true
sha1.workspace = true
tempfile.workspace = true
md-5.workspace = true
thiserror.workspace = true
rayon.workspace = true
hex = "=0.4.3"
pcre2.workspace = true

[dev-dependencies]
proptest.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "=1.0.0-alpha.4"
